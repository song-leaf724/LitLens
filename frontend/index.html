<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LitLens 阅读工作台</title>
    <link rel="stylesheet" href="/app/styles.css" />
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar" aria-label="文档与书源">
        <header class="brand">
          <div class="brand-mark">L</div>
          <div>
            <p class="eyebrow">LitLens</p>
            <h1>文学深读工作台</h1>
          </div>
        </header>

        <section class="panel upload-panel">
          <div class="panel-heading">
            <h2>上传文本</h2>
            <span>.txt / .md</span>
          </div>
          <label class="file-box" for="fileInput">
            <input id="fileInput" type="file" accept=".txt,.md,text/plain,text/markdown" />
            <span id="fileName">选择文学作品或片段</span>
          </label>
          <button id="uploadButton" class="primary full" type="button">上传并入库</button>
        </section>

        <section class="panel source-panel">
          <div class="panel-heading">
            <h2>公共书源</h2>
            <span>Gutenberg / Wikisource</span>
          </div>
          <div class="inline-fields">
            <select id="sourceSelect" aria-label="书源">
              <option value="gutenberg">Gutenberg</option>
              <option value="wikisource">Wikisource</option>
            </select>
            <button id="sourceSearchButton" class="secondary" type="button">搜索</button>
          </div>
          <input id="sourceQuery" type="text" placeholder="搜索作品名或作者，如 Pride and Prejudice / 静夜思" />
          <div id="sourceResults" class="source-results empty">搜索公开文本后，可一键导入。</div>
        </section>

        <section class="panel documents-panel">
          <div class="panel-heading">
            <h2>我的文本</h2>
            <button id="refreshDocumentsButton" class="ghost" type="button">刷新</button>
          </div>
          <div id="documentsList" class="documents-list empty">暂无文档。</div>
        </section>
      </aside>

      <main class="reader" aria-label="阅读分析区">
        <section class="document-banner">
          <div>
            <p class="eyebrow">当前文本</p>
            <h2 id="currentTitle">请选择或上传文本</h2>
          </div>
          <div id="currentMeta" class="meta-row">等待文档</div>
        </section>

        <section class="workspace-card query-card">
          <div class="query-toolbar">
            <div>
              <p class="eyebrow">问题</p>
              <h2>基于原文提问</h2>
            </div>
            <label class="topk-control">引用数量
              <input id="topKInput" type="number" min="1" max="20" value="5" />
            </label>
          </div>
          <textarea id="queryInput" rows="5" placeholder="例如：分析这首诗如何通过月光意象表达思乡之情"></textarea>
          <div class="actions">
            <button id="ragButton" class="primary" type="button">基于原文回答</button>
            <button id="agentButton" class="accent" type="button">深度细读</button>
          </div>
        </section>

        <section class="workspace-card answer-card">
          <div class="panel-heading">
            <h2>分析结果</h2>
            <span id="answerMode">等待提问</span>
          </div>
          <article id="answerContent" class="answer empty">回答会显示在这里。</article>
        </section>
      </main>

      <aside class="inspector" aria-label="引用与步骤">
        <section class="panel info-panel">
          <div class="panel-heading">
            <h2>文本信息</h2>
          </div>
          <div id="documentInfo" class="info-grid empty">暂无选中文档。</div>
        </section>

        <section class="panel citations-panel">
          <div class="panel-heading">
            <h2>原文依据</h2>
            <span id="citationCount">0</span>
          </div>
          <div id="citationsList" class="citation-list empty">回答时会在这里列出用到的原文。</div>
        </section>

        <section class="panel steps-panel">
          <div class="panel-heading">
            <h2>分析过程</h2>
            <span id="stepCount">0</span>
          </div>
          <div id="stepsList" class="steps-list empty">运行深度细读后，这里会展示分析过程。</div>
        </section>
      </aside>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="/app/app.js"></script>
  </body>
</html>
